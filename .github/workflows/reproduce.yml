name: Reproduce analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::survival
            any::gridExtra
            any::scales
            any::ggplot2
      - name: Run analysis
        run: Rscript run_all.R
      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data results figures
          git diff --staged --quiet || git commit -m "Regenerate data, results and figures [skip ci]"
          git push
